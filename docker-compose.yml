services:
  book-drift:
    build:
      context: .
      dockerfile: Dockerfile
    image: hubuzhi/book-drift:1.0
    container_name: book-drift
    ports:
      # 宿主 8081 → 容器 8080（8080 已被 Harbor 占用）
      - "8081:8080"
    environment:
      - TZ=Asia/Shanghai
      - LANG=C.UTF-8
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3